name: Artelynx code and authorization tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none
      - name: PHP syntax
        run: |
          find app database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Laravel test setup
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
      - name: Compile Blade templates
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan view:cache
      - name: Verify routes
        run: php artisan route:list --path=platform
      - name: Feature tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --compact
